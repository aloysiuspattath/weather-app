<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Void Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Sun Aura Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Electric Blue Arc Gradient -->
    <linearGradient id="radar-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Cyan Cloud Gradient -->
    <linearGradient id="cloud-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Radar Telemetry Orbit Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(59, 130, 246, 0.35)" stroke-width="3" stroke-dasharray="4 4" />

  <!-- Radar Pulse Radar Sweep Line -->
  <path d="M256 256 L386 126" stroke="url(#radar-blue)" stroke-width="5" stroke-linecap="round" filter="url(#neon-glow)" />

  <!-- Radiant Sun Burst Core -->
  <circle cx="190" cy="190" r="54" fill="url(#sun-glow)" filter="url(#neon-glow)" />
  <circle cx="190" cy="190" r="38" fill="#F59E0B" />

  <!-- Sun Rays -->
  <line x1="190" y1="114" x2="190" y2="98" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="114" y1="190" x2="98" y2="190" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="136" y1="136" x2="124" y2="124" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

  <!-- Glassmorphic Atmosphere Cloud Layer -->
  <path d="M 210 340 
           C 180 340, 160 315, 160 285 
           C 160 255, 185 235, 215 235 
           C 225 210, 255 190, 290 190 
           C 335 190, 370 220, 375 260 
           C 400 265, 415 285, 415 310 
           C 415 335, 395 355, 370 355 
           L 210 355 Z" 
        fill="url(#cloud-cyan)" 
        fill-opacity="0.9" 
        stroke="#E0F2FE" 
        stroke-width="5"
        filter="url(#neon-glow)"/>

  <!-- Lightning Telemetry Spark -->
  <path d="M275 285 L255 330 L280 330 L260 375" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
</svg>
