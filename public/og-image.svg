<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0A0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="cloud-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Radial Ambient Glows -->
  <circle cx="200" cy="200" r="350" fill="#3B82F6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="300" fill="#F59E0B" opacity="0.08" filter="blur(60px)"/>

  <!-- Outer Glass Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Logo Group -->
  <g transform="translate(100, 145)">
    <!-- Container Badge -->
    <rect width="180" height="180" rx="42" fill="#0A0F19" stroke="rgba(255, 255, 255, 0.18)" stroke-width="3" filter="url(#neon-glow)"/>

    <!-- Orbit Circles -->
    <circle cx="90" cy="90" r="65" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="90" cy="90" r="45" fill="none" stroke="rgba(59, 130, 246, 0.35)" stroke-width="2"/>

    <!-- Sun Core -->
    <circle cx="65" cy="65" r="22" fill="url(#sun-glow)"/>
    <circle cx="65" cy="65" r="15" fill="#F59E0B"/>

    <!-- Cloud Layer -->
    <path d="M 75 125 C 62 125, 52 115, 52 102 C 52 90, 62 82, 75 82 C 78 72, 90 64 105 64 C 122 64, 136 76, 138 92 C 148 94, 155 102, 155 112 C 155 122, 147 130, 136 130 Z" fill="url(#cloud-cyan)" stroke="#E0F2FE" stroke-width="2"/>
  </g>

  <!-- Typography Content -->
  <!-- Brand Name -->
  <text x="320" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">NexusWX</text>
  <text x="320" y="260" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600" fill="#3B82F6" letter-spacing="4">WORLD METEOROLOGICAL TELEMETRY STATION</text>

  <!-- Subtitle Description -->
  <text x="320" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="rgba(255, 255, 255, 0.85)">Live Satellite Radar • Multi-Model Consensus (ECMWF, GFS, JMA, ICON)</text>
  <text x="320" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="rgba(255, 255, 255, 0.6)">Smart Rain Predictor • Severe Hazard Warnings • Real-Time Local News</text>

  <!-- Feature Pills -->
  <g transform="translate(320, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="42" rx="21" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
    <text x="85" y="26" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">LIVE RADAR</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="200" height="42" rx="21" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="285" y="26" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">4-MODEL ENSEMBLE</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="200" height="42" rx="21" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="500" y="26" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">RAIN PREDICTOR</text>
  </g>

  <!-- Domain Footer Tag -->
  <text x="1080" y="525" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600" fill="rgba(255, 255, 255, 0.5)" text-anchor="end">weather.techfliq.com</text>
</svg>
